plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'net.barttolo.airships'
version = project.mod_version
base { archivesName = 'Barttolo-Airships-Forge-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client { workingDirectory project.file('run'); mods { barttoloairships { source sourceSets.main } } }
        server { workingDirectory project.file('run'); args '--nogui'; mods { barttoloairships { source sourceSets.main } } }
    }
}
repositories { mavenCentral() }
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }
jar {
    manifest.attributes(['Specification-Title': 'Barttolo Airships', 'Specification-Vendor': 'Barttolo', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.version])
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
