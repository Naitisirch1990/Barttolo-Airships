name: Desempaquetar fuentes de Barttolo Airships
on:
  push:
    branches: [development/alpha-0.1.3]
    paths: [.github/workflows/extract.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verificar y extraer fuentes legibles
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part-*.b64 | base64 --decode > /tmp/source.tar.xz
          echo "bf15aa4f600aa33c261d1b9748d7214f25ac689c370b06361c61bde9a3fe0518  /tmp/source.tar.xz" | sha256sum -c
          tar -xJf /tmp/source.tar.xz
          test -f src/main/java/net/barttolo/airships/AirshipEntity.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle gradle.properties settings.gradle src/main/
          if ! git diff --cached --quiet; then
            git commit -m "Expandir fuentes originales verificadas de Alfa 0.1.3"
            git push origin HEAD:development/alpha-0.1.3
          fi
