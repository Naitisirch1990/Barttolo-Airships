name: Barttolo Airships - Forge 1.20.1 (ALFA)
on:
  push:
    branches:
      - development/alpha-0.1.3
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Revisar y compilar (sin instalar en RingWorld)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout del repositorio independiente
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Recuperar código fuente y verificar su integridad
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part-*.b64 | base64 --decode > /tmp/barttolo-airships-src.tar.xz
          echo "bf15aa4f600aa33c261d1b9748d7214f25ac689c370b06361c61bde9a3fe0518  /tmp/barttolo-airships-src.tar.xz" | sha256sum --check
          tar -xJf /tmp/barttolo-airships-src.tar.xz
          test -f build.gradle
          test -f src/main/java/net/barttolo/airships/AirshipEntity.java
          test -f src/main/resources/assets/barttoloairships/models/airship_model.bin
      - name: Prueba geométrica aislada (sin Forge)
        shell: bash
        run: |
          mkdir -p /tmp/airship-check
          javac -d /tmp/airship-check src/main/java/net/barttolo/airships/AirshipFlightMath.java src/main/java/net/barttolo/airships/AirshipSafetyMath.java
          python3 - <<'PY'
          import struct
          path='src/main/resources/assets/barttoloairships/models/airship_model.bin'
          with open(path,'rb') as f:
              header=f.read(10)
          x,y,z,n=struct.unpack('>HHHI',header)
          assert (x,y,z)==(54,49,34), (x,y,z)
          assert 2000 <= n <= 4000, n
          print('Modelo validado:', x,y,z,'voxeles visibles:',n)
          PY
      - name: Compilar Forge 1.20.1
        run: gradle --no-daemon --stacktrace build
      - name: Guardar JAR experimental si compila
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Barttolo-Airships-1.20.1-ALFA-NO-INSTALAR-EN-PRODUCCION
          path: build/libs/*.jar
          if-no-files-found: error
